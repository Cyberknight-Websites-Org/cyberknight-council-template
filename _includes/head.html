    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
        {% if page.title %}
            {{ page.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>
    <link rel="alternate"
          type="application/atom+xml"
          title="{{ site.name }}"
          href="{{ site.url }}/feed.xml" />
    <meta name="generator" content="Jekyll v{{ jekyll.version }}" />
    {% if page.description %}
        <meta name="description" content="{{ page.description }}">
        <meta property="og:description" content="{{ page.description }}">
        <meta name="twitter:description" content="{{ page.description }}">
    {% else %}
        <meta name="description"
              content="{{ site.data.all_council_info_data.council_website_settings.homepage_description }}">
        <meta property="og:description"
              content="{{ site.data.all_council_info_data.council_website_settings.homepage_description }}">
        <meta name="twitter:description"
              content="{{ site.data.all_council_info_data.council_website_settings.homepage_description }}">
    {% endif %}
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="{{ page.url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    {% if page.event_flyer and page.event_flyer.thumbnail_url %}
        <meta property="og:image" content="{{ page.event_flyer.thumbnail_url }}">
        <meta name="twitter:image" content="{{ page.event_flyer.thumbnail_url  }}">
    {% elsif page.opengraph_image_url %}
        <meta property="og:image" content="{{ page.opengraph_image_url }}">
        <meta name="twitter:image" content="{{ page.opengraph_image_url }}">
    {% else %}
        <meta property="og:image"
              content="{{ site.data.all_council_info_data.council_info.council_opengraph_url }}">
        <meta name="twitter:image"
              content="{{ site.data.all_council_info_data.council_info.council_opengraph_url }}">
    {% endif %}
    <meta property="twitter:url" content="{{ page.url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }}">
    <!-- Favicon -->
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="{{ site.url }}/assets/favicon/apple-touch-icon.png">
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="{{ site.url }}/assets/favicon/favicon-32x32.png">
    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="{{ site.url }}/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="{{ site.url }}/assets/favicon/site.webmanifest">
    <!-- theme-color -->
    <meta name="theme-color" content="#000000">
    <!-- Google site verification -->
    <meta name="google-site-verification"
          content="VsNyvMxYvOQFM1OyN-DUCMvUDGYbj3xb6ZmPBbkNLYo" />
    <!-- CSS -->
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
    <script>
  var parishData = {
    markerCoordinates: [
      {% for parish in site.data.all_council_info_data.council_parishes %}
        [{{ parish.gps_coordinates[0] }}, {{ parish.gps_coordinates[1] }}]{% unless forloop.last %}, {% endunless %}
      {% endfor %}
    ],
    parishNames: [
      {% for parish in site.data.all_council_info_data.council_parishes %}
        "{{ parish.parish_name }}"{% unless forloop.last %}, {% endunless %}
      {% endfor %}
    ],
    parishAddresses: [
      {% for parish in site.data.all_council_info_data.council_parishes %}
        "{{ parish.parish_address | replace: ", USA", "" }}"{% unless forloop.last %}, {% endunless %}
      {% endfor %}
    ]
  };
  var councilData = {
    councilNumber: "{{ site.data.all_council_info_data.council_info.council_number }}"
  };
    </script>
    <script src="{{ '/assets/js/leaflet.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/newsletter.js' | relative_url }}"></script>
